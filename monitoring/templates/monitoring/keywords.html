{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FlagWatch — Keywords</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <!-- Our shared CSS -->
  <link rel="stylesheet" href="{% static 'monitoring/styles.css' %}"/>

</head>
<body>

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-badge">
        <div class="brand-icon">📡</div>
        <span class="brand-name">FlagWatch</span>
      </div>
      <div class="brand-tagline">Content Monitoring</div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-label">Monitor</div>
      <a class="nav-item" href="/">
        <i class="bi bi-grid-1x2 nav-icon"></i> Dashboard
      </a>
      <a class="nav-item" href="/flags">
        <i class="bi bi-flag nav-icon"></i> Flags
        <span class="nav-badge" id="sidebar-pending-count">—</span>
      </a>
      <a class="nav-item" href="/content">
        <i class="bi bi-file-text nav-icon"></i> Content
      </a>

      <div class="nav-label">Configure</div>
      <a class="nav-item active" href="/keywords">
        <i class="bi bi-tags nav-icon"></i> Keywords
      </a>
    </nav>

    <div class="sidebar-footer">
      API: <span style="color:#F5A623">localhost:8000</span>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main">

    <!-- Topbar -->
    <div class="topbar">
      <div>
        <div class="topbar-title">Keywords</div>
        <div class="topbar-sub">Manage the terms you want to monitor</div>
      </div>
      <!-- live count shown in the topbar -->
      <div style="font-family:'Roboto Mono',monospace; font-size:13px; color:var(--text-muted)">
        <span id="kw-total">—</span> keywords
      </div>
    </div>

    <!-- Content -->
    <div class="content-area">

      <!-- Add keyword form -->
      <div class="add-form">
        <div class="add-form-title">Add a new keyword</div>
        <div class="add-form-row">
          <input
            type="text"
            id="kw-input"
            class="kw-input"
            placeholder="e.g. climate, election, AI..."
            maxlength="255"
          />
          <button class="btn-primary" onclick="addKeyword()">
            <i class="bi bi-plus-lg"></i> Add Keyword
          </button>
        </div>
      </div>

      <!-- Keywords grid -->
      <div class="section-header">
        <div class="section-title">Active Keywords</div>
      </div>

      <div class="keywords-grid" id="keywords-grid">
        <!-- filled by JavaScript -->
      </div>

    </div>
  </div>

  <!-- Toast -->
  <div class="toast-box" id="toast">
    <i class="bi bi-check-circle-fill toast-icon"></i>
    <span id="toast-msg">Done.</span>
  </div>
  <script src="{% static 'monitoring/keywords.js' %}"></script>

 
</body>
</html>
