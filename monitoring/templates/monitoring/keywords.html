<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FlagWatch — Keywords</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <!-- Our shared CSS -->
  <link rel="stylesheet" href="static/styles.css"/>

  <style>
    /* ── Page-specific styles only ── */

    /* The add keyword form area */
    .add-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 28px;
    }

    .add-form-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* The input + button sit side by side */
    .add-form-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .kw-input {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Roboto Mono', monospace;
      color: var(--text-main);
      background: var(--canvas);
      outline: none;
      transition: border 0.15s, box-shadow 0.15s;
    }

    /* Highlight the input when it's focused (clicked into) */
    .kw-input:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15);
      background: var(--surface);
    }

    /* ── Keyword cards grid ── */
    .keywords-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .kw-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      animation: fadeIn 0.25s ease both;
      transition: box-shadow 0.15s, border-color 0.15s;
    }

    .kw-card:hover {
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      border-color: var(--amber);
    }

    .kw-card-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* The amber dot on each keyword card */
    .kw-dot {
      width: 8px; height: 8px;
      background: var(--amber);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .kw-name {
      font-family: 'Roboto Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .kw-id {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Delete button — hidden until you hover the card */
    .kw-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
      opacity: 0;  /* invisible by default */
    }

    /* Show delete button when card is hovered */
    .kw-card:hover .kw-delete {
      opacity: 1;
    }

    .kw-delete:hover {
      color: var(--red);
      background: #FEF2F2;
    }

    /* Skeleton card for loading state */
    .kw-card-skeleton {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
  </style>
</head>
<body>

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-badge">
        <div class="brand-icon">📡</div>
        <span class="brand-name">FlagWatch</span>
      </div>
      <div class="brand-tagline">Content Monitoring</div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-label">Monitor</div>
      <a class="nav-item" href="/">
        <i class="bi bi-grid-1x2 nav-icon"></i> Dashboard
      </a>
      <a class="nav-item" href="/flags">
        <i class="bi bi-flag nav-icon"></i> Flags
        <span class="nav-badge" id="sidebar-pending-count">—</span>
      </a>
      <a class="nav-item" href="/content">
        <i class="bi bi-file-text nav-icon"></i> Content
      </a>

      <div class="nav-label">Configure</div>
      <a class="nav-item active" href="/keywords">
        <i class="bi bi-tags nav-icon"></i> Keywords
      </a>
    </nav>

    <div class="sidebar-footer">
      API: <span style="color:#F5A623">localhost:8000</span>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main">

    <!-- Topbar -->
    <div class="topbar">
      <div>
        <div class="topbar-title">Keywords</div>
        <div class="topbar-sub">Manage the terms you want to monitor</div>
      </div>
      <!-- live count shown in the topbar -->
      <div style="font-family:'Roboto Mono',monospace; font-size:13px; color:var(--text-muted)">
        <span id="kw-total">—</span> keywords
      </div>
    </div>

    <!-- Content -->
    <div class="content-area">

      <!-- Add keyword form -->
      <div class="add-form">
        <div class="add-form-title">Add a new keyword</div>
        <div class="add-form-row">
          <input
            type="text"
            id="kw-input"
            class="kw-input"
            placeholder="e.g. climate, election, AI..."
            maxlength="255"
          />
          <button class="btn-primary" onclick="addKeyword()">
            <i class="bi bi-plus-lg"></i> Add Keyword
          </button>
        </div>
      </div>

      <!-- Keywords grid -->
      <div class="section-header">
        <div class="section-title">Active Keywords</div>
      </div>

      <div class="keywords-grid" id="keywords-grid">
        <!-- filled by JavaScript -->
      </div>

    </div>
  </div>

  <!-- Toast -->
  <div class="toast-box" id="toast">
    <i class="bi bi-check-circle-fill toast-icon"></i>
    <span id="toast-msg">Done.</span>
  </div>

  <script>
    const API = '/api';

    // ── Load keywords when page opens ──
    loadKeywords();

    async function loadKeywords() {
      showSkeletons();

      try {
        const res  = await fetch(`${API}/keywords/`);
        const data = await res.json();
        renderKeywords(data);
        loadPendingCount(); // update sidebar badge
      } catch (e) {
        showToast('Could not reach the API. Is Django running?', true);
      }
    }

    // ── Render all keyword cards ──
    function renderKeywords(keywords) {
      const grid = document.getElementById('keywords-grid');
      document.getElementById('kw-total').textContent = keywords.length;

      if (keywords.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <div class="empty-icon">🏷️</div>
            <div class="empty-title">No keywords yet</div>
            <div class="empty-sub">Add your first keyword above to start monitoring.</div>
          </div>`;
        return;
      }

      grid.innerHTML = keywords.map(kw => `
        <div class="kw-card" id="kw-card-${kw.id}">
          <div class="kw-card-left">
            <div class="kw-dot"></div>
            <div>
              <div class="kw-name">${kw.name}</div>
              <div class="kw-id">ID: ${kw.id}</div>
            </div>
          </div>
          <button class="kw-delete" onclick="deleteKeyword(${kw.id})" title="Delete keyword">
            <i class="bi bi-trash3"></i>
          </button>
        </div>
      `).join('');
    }

    // ── Add a new keyword ──
    async function addKeyword() {
      // 1. Get whatever the user typed
      const input = document.getElementById('kw-input');
      const name  = input.value.trim(); // .trim() removes accidental spaces

      // 2. Don't send an empty keyword
      if (!name) {
        showToast('Please type a keyword first.', true);
        return;
      }

      try {
        // 3. POST to Django — sending the name as JSON
        const res = await fetch(`${API}/keywords/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name })
        });

        if (!res.ok) {
          showToast('Could not add keyword.', true);
          return;
        }

        // 4. Clear the input box ready for the next one
        input.value = '';

        // 5. Reload the list so the new keyword appears
        loadKeywords();
        showToast(`"${name}" added.`);

      } catch (e) {
        showToast('Could not add keyword.', true);
      }
    }

    // ── Delete a keyword ──
    async function deleteKeyword(kwId) {
      // Ask the user to confirm before deleting
      if (!confirm('Delete this keyword? Any flags linked to it will also be deleted.')) return;

      try {
        // DELETE request — no body needed, the ID is in the URL
        await fetch(`${API}/keywords/${kwId}/`, {
          method: 'DELETE'
        });

        // Remove just this card from the page without reloading everything
        const card = document.getElementById(`kw-card-${kwId}`);
        card.style.opacity = '0';
        card.style.transform = 'scale(0.95)';
        card.style.transition = 'opacity 0.2s, transform 0.2s';

        // After the animation finishes, remove from DOM and reload
        setTimeout(() => loadKeywords(), 250);

        showToast('Keyword deleted.');

      } catch (e) {
        showToast('Could not delete keyword.', true);
      }
    }

    // ── Allow pressing Enter to add keyword ──
    document.getElementById('kw-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') addKeyword();
    });
    // ↑ This is an "event listener" — it watches for a specific event on an element
    //   'keydown' fires every time a key is pressed while the input is focused
    //   e.key tells us which key it was

    // ── Load pending flags count for sidebar badge ──
    async function loadPendingCount() {
      try {
        const res   = await fetch(`${API}/flags/`);
        const flags = await res.json();
        const count = flags.filter(f => f.status === 'pending').length;
        document.getElementById('sidebar-pending-count').textContent = count;
      } catch (e) { /* silently fail, not critical */ }
    }

    // ── Loading skeletons ──
    function showSkeletons() {
      const grid = document.getElementById('keywords-grid');
      grid.innerHTML = [1,2,3,4,5,6].map(() => `
        <div class="kw-card-skeleton">
          <div class="skeleton" style="width:8px;height:8px;border-radius:50%;flex-shrink:0"></div>
          <div style="flex:1">
            <div class="skeleton" style="width:70%;margin-bottom:8px"></div>
            <div class="skeleton" style="width:40%;height:11px"></div>
          </div>
        </div>
      `).join('');
    }

    // ── Toast ──
    function showToast(msg, isError = false) {
      const t    = document.getElementById('toast');
      const icon = t.querySelector('.toast-icon');
      document.getElementById('toast-msg').textContent = msg;
      icon.className = isError
        ? 'bi bi-exclamation-circle-fill toast-icon'
        : 'bi bi-check-circle-fill toast-icon';
      icon.style.color = isError ? '#EF4444' : '#F5A623';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }
  </script>

</body>
</html>
