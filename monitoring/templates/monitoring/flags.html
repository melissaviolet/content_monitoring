{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FlagWatch — Flags</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'monitoring/styles.css' %}">
  <script src="static/monitoring/flags.js"></script>

</head>
<body>

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-badge">
        <div class="brand-icon">📡</div>
        <span class="brand-name">FlagWatch</span>
      </div>
      <div class="brand-tagline">Content Monitoring</div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-label">Monitor</div>
      <a class="nav-item" href="/">
        <i class="bi bi-grid-1x2 nav-icon"></i> Dashboard
      </a>
      <a class="nav-item active" href="/flags">
        <i class="bi bi-flag nav-icon"></i> Flags
        <span class="nav-badge" id="sidebar-pending-count">—</span>
      </a>
      <a class="nav-item" href="/content">
        <i class="bi bi-file-text nav-icon"></i> Content
      </a>

      <div class="nav-label">Configure</div>
      <a class="nav-item" href="/keywords">
        <i class="bi bi-tags nav-icon"></i> Keywords
      </a>
    </nav>

    <div class="sidebar-footer">
      API: <span style="color:#F5A623">localhost:8000</span>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main">

    <!-- Topbar -->
    <div class="topbar">
      <div>
        <div class="topbar-title">Flags</div>
        <div class="topbar-sub">Review flagged content and mark decisions</div>
      </div>
    </div>

    <!-- Content -->
    <div class="content-area">

      <!-- Filter tabs -->
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="setFilter('all', this)">
          All <span class="tab-count" id="count-all">0</span>
        </button>
        <button class="filter-tab" onclick="setFilter('pending', this)">
          Pending <span class="tab-count" id="count-pending">0</span>
        </button>
        <button class="filter-tab" onclick="setFilter('relevant', this)">
          Relevant <span class="tab-count" id="count-relevant">0</span>
        </button>
        <button class="filter-tab" onclick="setFilter('irrelevant', this)">
          Irrelevant <span class="tab-count" id="count-irrelevant">0</span>
        </button>
      </div>

      <!-- Flags list -->
      <div id="flags-list">
        <!-- filled by JavaScript -->
      </div>

    </div>
  </div>

  <!-- Toast -->
  <div class="toast-box" id="toast">
    <i class="bi bi-check-circle-fill toast-icon"></i>
    <span id="toast-msg">Done.</span>
  </div>

</body>
</html>
